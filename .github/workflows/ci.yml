name: Fork validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify module dependencies
        shell: pwsh
        run: ./scripts/check-architecture.ps1
      - name: Test and build
        working-directory: PipePipeClient
        run: ./gradlew :core:cache:test :data:media:test :app:assembleDebug :app:lintDebug --console=plain
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PipeNotPipe-debug
          path: PipePipeClient/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            PipePipeClient/core/cache/build/reports/tests/
            PipePipeClient/data/media/build/reports/tests/
            PipePipeClient/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
